[package]
name = "mesh-tools-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Language server for .mesh single-file components"

[[bin]]
name = "mesh-tools-lsp"
path = "src/main.rs"

[dependencies]
mesh-core-component = { workspace = true }
mesh-core-config    = { workspace = true }
mesh-core-elements  = { workspace = true }
mesh-core-module    = { workspace = true }
mesh-core-resources = { workspace = true }
mesh-core-service   = { workspace = true }
mesh-core-surface-config = { workspace = true }
mesh-core-theme     = { workspace = true }

stylua     = { version = "2.5", default-features = false, features = ["luau"] }
full_moon  = { workspace = true }
tower-lsp  = "0.20"
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
json-syntax = { workspace = true }
jsonc-parser = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
